name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6 and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ \
            qt6-base-dev qt6-svg-dev qt6-pdf-dev \
            desktop-file-utils appstream

      - name: Configure
        run: cmake -B build -G Ninja -DFINILY_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Stage Linux install and validate desktop metadata
        run: |
          cmake --install build --prefix /tmp/finily-stage
          test -x /tmp/finily-stage/bin/finily
          test -f /tmp/finily-stage/share/icons/hicolor/scalable/apps/io.github.yorditry2.Finily.svg
          test -f /tmp/finily-stage/share/mime/packages/io.github.yorditry2.Finily.xml
          desktop-file-validate /tmp/finily-stage/share/applications/io.github.yorditry2.Finily.desktop
          appstreamcli validate --no-net --pedantic /tmp/finily-stage/share/metainfo/io.github.yorditry2.Finily.metainfo.xml

  linux-flatpak:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Finily-x86_64.flatpak
          manifest-path: flatpak/io.github.yorditry2.Finily.yml
          cache-key: flatpak-kde-6.11

      - name: Package Flatpak bundle and checksum
        run: |
          mkdir -p dist-flatpak
          mv Finily-x86_64.flatpak dist-flatpak/Finily-x86_64.flatpak
          (cd dist-flatpak && sha256sum Finily-x86_64.flatpak > Finily-x86_64.flatpak.sha256)
          cut -d' ' -f1 dist-flatpak/Finily-x86_64.flatpak.sha256 > dist-flatpak/flatpak.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak-assets
          path: dist-flatpak/

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-pdf

      - name: Build Windows installer
        shell: cmd
        run: windows\Build-Installer.cmd "${{ steps.msys2.outputs.msys2-location }}\ucrt64"

      - name: Package checksum and update manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $setupSrc = 'build-windows\Finily-Setup-x64.exe'
          $setupDst = 'dist\Finily-Setup-x64.exe'
          Copy-Item $setupSrc $setupDst -Force

          $hash = (Get-FileHash $setupDst -Algorithm SHA256).Hash.ToLowerInvariant()
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText((Join-Path (Resolve-Path dist) 'SHA256SUMS.txt'), "$hash  Finily-Setup-x64.exe`n", $utf8NoBom)

          $version = (Get-Content 'build-windows\finily-version.txt' -Raw).Trim()
          $tag = '${{ github.ref_name }}'
          $repo = '${{ github.repository }}'
          $manifest = [ordered]@{
              version      = $version
              tag          = $tag
              published_at = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
              release_url  = "https://github.com/$repo/releases/tag/$tag"
              windows      = [ordered]@{
                  asset  = 'Finily-Setup-x64.exe'
                  url    = "https://github.com/$repo/releases/download/$tag/Finily-Setup-x64.exe"
                  sha256 = $hash
              }
          } | ConvertTo-Json -Depth 4
          [System.IO.File]::WriteAllText((Join-Path (Resolve-Path dist) 'update-manifest.json'), "$manifest`n", $utf8NoBom)

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: dist/

  publish-release:
    needs: [linux-tests, linux-flatpak, windows-installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: linux-flatpak-assets
          path: dist

      - name: Merge Linux Flatpak checksum and update manifest
        run: |
          cat dist/Finily-x86_64.flatpak.sha256 >> dist/SHA256SUMS.txt
          FLATPAK_SHA="$(tr -d '[:space:]' < dist/flatpak.sha256)"
          FLATPAK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Finily-x86_64.flatpak"
          jq --arg sha "$FLATPAK_SHA" --arg url "$FLATPAK_URL" \
            '. + {flatpak: {app_id: "io.github.yorditry2.Finily", asset: "Finily-x86_64.flatpak", url: $url, sha256: $sha}}' \
            dist/update-manifest.json > dist/update-manifest.tmp.json
          mv dist/update-manifest.tmp.json dist/update-manifest.json

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              dist/Finily-Setup-x64.exe \
              dist/Finily-x86_64.flatpak \
              dist/SHA256SUMS.txt \
              dist/update-manifest.json \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              dist/Finily-Setup-x64.exe \
              dist/Finily-x86_64.flatpak \
              dist/SHA256SUMS.txt \
              dist/update-manifest.json \
              --title "Finily ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
