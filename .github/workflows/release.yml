name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6 and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ \
            qt6-base-dev qt6-svg-dev qt6-pdf-dev qt6-wayland dpkg-dev

      - name: Build, test, and package Linux binaries
        run: |
          chmod +x linux/Build-Linux-Packages.sh
          ./linux/Build-Linux-Packages.sh build-linux dist-linux
          cp build-linux/finily-version.txt dist-linux/finily-version.txt

      - name: Generate Linux checksums and manifest fragment
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          dist = Path("dist-linux")
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          linux_manifest = {}
          checksums = []

          for key, filename in [
              ("tarball", "Finily-Linux-x64.tar.gz"),
              ("deb", "Finily-Linux-x64.deb"),
          ]:
              path = dist / filename
              if not path.is_file():
                  raise FileNotFoundError(f"Missing Linux package: {path}")
              sha = hashlib.sha256(path.read_bytes()).hexdigest().lower()
              checksums.append(f"{sha}  {filename}")
              linux_manifest[key] = {
                  "asset": filename,
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{filename}",
                  "sha256": sha,
              }

          (dist / "SHA256SUMS-linux.txt").write_text("\n".join(checksums) + "\n", encoding="utf-8")
          (dist / "manifest-linux.json").write_text(json.dumps(linux_manifest, indent=2) + "\n", encoding="utf-8")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: linux-release-assets
          path: dist-linux/

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-pdf

      - name: Build Windows installer
        shell: cmd
        run: windows\Build-Installer.cmd "${{ steps.msys2.outputs.msys2-location }}\ucrt64"

      - name: Package Windows checksum and manifest fragment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist-windows | Out-Null
          $setupSrc = 'build-windows\Finily-Setup-x64.exe'
          $setupDst = 'dist-windows\Finily-Setup-x64.exe'
          Copy-Item $setupSrc $setupDst -Force

          $hash = (Get-FileHash $setupDst -Algorithm SHA256).Hash.ToLowerInvariant()
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          $distAbs = (Resolve-Path 'dist-windows').Path
          [System.IO.File]::WriteAllText((Join-Path $distAbs 'SHA256SUMS-windows.txt'), "$hash  Finily-Setup-x64.exe`n", $utf8NoBom)

          $tag = '${{ github.ref_name }}'
          $repo = '${{ github.repository }}'
          $winManifest = [ordered]@{
              asset  = 'Finily-Setup-x64.exe'
              url    = "https://github.com/$repo/releases/download/$tag/Finily-Setup-x64.exe"
              sha256 = $hash
          } | ConvertTo-Json -Depth 3
          [System.IO.File]::WriteAllText((Join-Path $distAbs 'manifest-windows.json'), "$winManifest`n", $utf8NoBom)

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: dist-windows/

  publish-release:
    needs: [linux-package, windows-installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-release-assets
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: dist

      - name: Merge checksums and update-manifest.json
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          dist = Path("dist")
          version = (dist / "finily-version.txt").read_text(encoding="utf-8").strip()
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]

          win = json.loads((dist / "manifest-windows.json").read_text(encoding="utf-8"))
          lin = json.loads((dist / "manifest-linux.json").read_text(encoding="utf-8"))

          manifest = {
              "version": version,
              "tag": tag,
              "published_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "release_url": f"https://github.com/{repo}/releases/tag/{tag}",
              "windows": win,
              "linux": lin,
          }
          (dist / "update-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          sums = (
              (dist / "SHA256SUMS-windows.txt").read_text(encoding="utf-8").strip()
              + "\n"
              + (dist / "SHA256SUMS-linux.txt").read_text(encoding="utf-8").strip()
              + "\n"
          )
          (dist / "SHA256SUMS.txt").write_text(sums, encoding="utf-8")
          PY

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=(
            dist/Finily-Setup-x64.exe
            dist/Finily-Linux-x64.tar.gz
            dist/Finily-Linux-x64.deb
            dist/SHA256SUMS.txt
            dist/update-manifest.json
          )
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              "${ASSETS[@]}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              "${ASSETS[@]}" \
              --title "Finily ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
