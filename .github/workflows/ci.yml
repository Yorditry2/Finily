name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6 and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ \
            qt6-base-dev qt6-svg-dev qt6-pdf-dev

      - name: Configure
        run: cmake -B build -G Ninja -DFINILY_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Run unit tests
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure

  windows-build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-pdf

      - name: Configure and build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $ucrt = "${{ steps.msys2.outputs.msys2-location }}\ucrt64"
          $env:PATH = "$ucrt\bin;$env:PATH"
          cmake -S . -B build-windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DFINILY_BUILD_TESTS=ON "-DCMAKE_PREFIX_PATH=$ucrt" "-DCMAKE_CXX_COMPILER=$ucrt/bin/g++.exe" "-DCMAKE_MAKE_PROGRAM=$ucrt/bin/ninja.exe"
          cmake --build build-windows

      - name: Run unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $ucrt = "${{ steps.msys2.outputs.msys2-location }}\ucrt64"
          $env:PATH = "$ucrt\bin;$env:PATH"
          $env:QT_PLUGIN_PATH = "$ucrt\share\qt6\plugins"
          $env:QT_QPA_PLATFORM = 'offscreen'
          ctest --test-dir build-windows --output-on-failure

      - name: Verify Windows runtime staging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $ucrt = "${{ steps.msys2.outputs.msys2-location }}\ucrt64"
          $env:PATH = "$ucrt\bin;$env:PATH"
          cmake --install build-windows --prefix build-windows/stage
          windeployqt --release --no-translations --no-compiler-runtime --no-system-d3d-compiler --no-system-dxc-compiler build-windows/stage/finily.exe
          cmake "-DSTAGE=build-windows/stage" "-DUCRT=$ucrt" "-DOBJDUMP=$ucrt/bin/objdump.exe" -P windows/Stage-Runtime.cmake
          foreach ($required in @(
            'build-windows/stage/finily.exe',
            'build-windows/stage/Qt6Svg.dll',
            'build-windows/stage/platforms/qwindows.dll',
            'build-windows/stage/Licencias/Inter-OFL.txt'
          )) {
            if (-not (Test-Path -PathType Leaf $required)) {
              throw "Missing staged runtime file: $required"
            }
          }
