<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finily — Estados vacíos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shell.css">
<style>
  .art svg { display: block; }
  .art .ln { fill: none; stroke: #C4C4CB; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .art .fl { fill: #F6F6F4; }
  .hint-up { position: absolute; right: 70px; top: 64px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; color: var(--muted); font-size: 11.5px; font-weight: 500; }
  .hint-up svg { width: 64px; height: 46px; fill: none; stroke: #C4C4CB; stroke-width: 1.4; stroke-dasharray: 3 4; stroke-linecap: round; }
</style>
</head>
<body>
<div class="page-title">Estados vacíos</div>
<p class="hint">Modo Claro. Cuando no hay nada que mostrar: dibujo de línea fina en gris neutro (sin color de marca, para que cualquier tema lo herede), una frase que dice qué pasa y una sola salida. No hay botones que repitan <b>+ Nuevo</b>.</p>
<nav class="toc" id="toc"></nav>
<div id="out" style="display:contents"></div>

<script src="_shell.js"></script>
<script>
/* Dibujos de línea (heredan el gris del tema) */
const ART = {
  library: `<svg width="190" height="96" viewBox="0 0 190 96">
    <g transform="translate(4,30)"><path class="ln fl" d="M2 8C2 4 4 2 8 2h14c3 0 4 1 6 3l2 2h28c3 0 6 2 6 6v34c0 3-3 6-6 6H8c-3 0-6-3-6-6z"/></g>
    <g transform="translate(76,6)"><rect class="ln fl" x="1" y="1" width="44" height="58" rx="3"/><path class="ln" d="M7 1v58M14 12h22"/></g>
    <g transform="translate(130,40)"><rect class="ln fl" x="1" y="1" width="56" height="42" rx="6"/><path class="ln" d="M42 34c2-3 4-3 6 0s4 3 6 0" transform="translate(-10,-6)"/></g>
    <path class="ln" d="M10 92h170" stroke-dasharray="2 5"/></svg>`,
  folder: `<svg width="130" height="96" viewBox="0 0 130 96"><path class="ln fl" d="M6 22c0-6 4-10 10-10h26c4 0 6 1 9 4l4 4h52c6 0 10 4 10 10v52c0 6-4 10-10 10H16c-6 0-10-4-10-10z"/><path class="ln" d="M6 36h111"/><path class="ln" d="M56 58h18M65 49v18" stroke-dasharray="2 4"/></svg>`,
  search: `<svg width="110" height="96" viewBox="0 0 110 96"><circle class="ln fl" cx="46" cy="42" r="28"/><path class="ln" d="M67 63l22 22"/><path class="ln" d="M36 42h20" /></svg>`,
  star: `<svg width="110" height="96" viewBox="0 0 110 96"><path class="ln fl" d="M55 10l11 22 24 3.5-17.5 17 4 24L55 65 33.5 76.5l4-24L20 35.5 44 32z"/><path class="ln" d="M92 14l4-4M98 26h6M18 14l-4-4" /></svg>`,
  trash: `<svg width="110" height="96" viewBox="0 0 110 96"><path class="ln fl" d="M30 26h50l-5 58a6 6 0 0 1-6 5H41a6 6 0 0 1-6-5z"/><path class="ln" d="M24 26h62M44 26v-8h22v8M48 40v34M62 40v34"/></svg>`,
  tag: `<svg width="110" height="96" viewBox="0 0 110 96"><path class="ln fl" d="M22 48V16h32l36 36-32 32z"/><circle class="ln" cx="38" cy="32" r="5"/></svg>`,
};
const empty = (art, h, p, acts = '') => `<div class="empty"><div class="art">${ART[art]}</div><h3>${h}</h3><p>${p}</p>${acts ? `<div class="acts">${acts}</div>` : ''}</div>`;
const S = [];

S.push(scene('primera', '01', 'Primera vez: biblioteca vacía',
  'En lugar de un botón «Crear» que duplique <b>+ Nuevo</b>, una flecha punteada muy suave apunta a él. La frase dice también lo que se puede hacer sin buscar menús: Ctrl N y arrastrar un PDF.',
  frameHTML({
    sb: { tags: false },
    body: empty('library', 'Tu biblioteca está lista', 'Crea tu primera pizarra o cuaderno con <b>+ Nuevo</b>, abre una nota rápida con <span class="kbd">Ctrl N</span> o suelta aquí un PDF.'),
    libOverlay: `<div class="hint-up"><svg viewBox="0 0 64 46"><path d="M4 42C20 40 44 30 56 6"/><path d="M50 8l6-3 2 7" stroke-dasharray="none"/></svg></div>`,
  }),
  `<ul><li>Etiquetas no aparece en el sidebar porque todavía no hay ninguna (sección progresiva, ya aprobada).</li></ul>`));

S.push(scene('carpeta', '02', 'Carpeta vacía',
  'Lo que se cree con <b>+ Nuevo</b> estando aquí se guarda directamente en esta carpeta, y la frase lo deja claro.',
  frameHTML({
    sb: { active: 'folders', folders: true }, hdr: { title: ['Carpetas', 'Apuntes', 'Semestre 1'] },
    body: empty('folder', 'Semestre 1 está vacía', 'Arrastra documentos hasta aquí o usa <b>+ Nuevo</b>: lo que crees se guardará en esta carpeta.'),
  })));

S.push(scene('busqueda', '03', 'Búsqueda sin resultados',
  'La salida depende de lo que está limitando: si hay un ámbito (carpeta) o un filtro activo, se ofrece quitarlo con un clic. Si no hay nada que quitar, solo se muestra la frase.',
  frameHTML({
    hdr: searchHeader('termodinamica', { scope: 'Apuntes', filterBadge: true }),
    subbar: `<div class="subbar"><span class="chip on">${svgI('book')}Cuadernos<span class="x">${svgI('x')}</span></span></div>`,
    body: empty('search', 'Sin resultados para «termodinamica»', 'Estás buscando solo en <b>Apuntes</b> y solo cuadernos.', `<button class="text-btn">Buscar en toda la biblioteca</button><button class="text-btn">Quitar filtro</button>`),
  })));

S.push(scene('favoritos', '04', 'Favoritos vacío',
  'Explica cómo marcar un favorito. No hay botón: la acción se hace sobre cada documento.',
  frameHTML({
    sb: { active: 'favs' }, hdr: { title: 'Favoritos' },
    body: empty('star', 'Aún no tienes favoritos', 'Clic derecho › <b>Añadir a favoritos</b> o <span class="kbd">Ctrl B</span> sobre cualquier documento o carpeta para tenerlo a mano aquí.'),
  })));

S.push(scene('papelera', '05', 'Papelera vacía',
  'Recuerda cuánto tiempo se guardan las cosas. El plazo (30 días) se podrá cambiar en Ajustes.',
  frameHTML({
    sb: { active: 'trash' }, hdr: { title: 'Papelera' },
    body: empty('trash', 'La papelera está vacía', 'Lo que borres se guarda aquí <b>30 días</b> por si cambias de opinión.'),
  })));

S.push(scene('etiqueta', '06', 'Etiqueta sin documentos',
  'Una etiqueta que se quedó sin documentos ofrece borrarla, porque si no se queda ocupando sitio en el sidebar.',
  frameHTML({
    sb: { active: 'tags', tagsOpen: true, tag: 'examen' }, hdr: { title: ['Etiquetas', '# examen'] },
    body: empty('tag', 'Nada con «examen» todavía', 'Añade esta etiqueta desde el clic derecho de un documento, o bórrala si ya no la usas.', `<button class="text-btn danger">${svgI('trash')}Borrar etiqueta</button>`),
  })));

document.getElementById('out').innerHTML = S.join('');
document.getElementById('toc').innerHTML = [...document.querySelectorAll('.scene')].map(s => `<a href="#${s.id}">${s.querySelector('h2').textContent.slice(2)}</a>`).join('');
fitFrames();
</script>
</body>
</html>
