<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finily — Editor: propuestas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shell.css">
<style>
  /* ---------- Editor: tokens propios (heredan los de _shell) ---------- */
  .ed { --desk: #FFFFFF; --gridline: rgba(15,23,42,.055); --ink: #18181B; --cap: rgba(255,255,255,.82); --capline: rgba(15,23,42,.08); --capshadow: 0 8px 24px -10px rgba(15,23,42,.22), 0 1px 2px rgba(15,23,42,.06); --hov: rgba(15,23,42,.05); --on: #18181B; --onfg: #fff; --tx: #18181B; --mu: #71717A; --sheet: #fff; --deskNb: #F1F1EF;
    width: 1180px; height: 720px; position: relative; overflow: hidden; border-radius: 14px; background: var(--desk); color: var(--tx); box-shadow: 0 30px 60px -22px rgba(15,23,42,.33); transform-origin: top left; }
  .ed.dark { --desk: #1A1B22; --gridline: rgba(255,255,255,.05); --ink: #F4F4F5; --cap: rgba(35,36,45,.82); --capline: rgba(255,255,255,.08); --capshadow: 0 10px 28px -10px rgba(0,0,0,.6), 0 1px 2px rgba(0,0,0,.3); --hov: rgba(255,255,255,.07); --on: #F4F4F5; --onfg: #18181B; --tx: #F4F4F5; --mu: #A1A1AA; --sheet: #23242D; --deskNb: #121318; }
  .ed.grid { background-image: linear-gradient(var(--gridline) 1px, transparent 1px), linear-gradient(90deg, var(--gridline) 1px, transparent 1px); background-size: 28px 28px; background-color: var(--desk); }
  .ed.nb { background: var(--deskNb); }
  .ed svg.i { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* Cápsula de vidrio */
  .cap { position: absolute; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 14px; background: var(--cap); border: 1px solid var(--capline); box-shadow: var(--capshadow); backdrop-filter: blur(14px) saturate(1.4); z-index: 5; }
  .cap.v { flex-direction: column; padding: 5px; }
  .tb { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--tx); opacity: .82; position: relative; }
  .tb:hover { background: var(--hov); opacity: 1; }
  .tb.on { background: var(--on); color: var(--onfg); opacity: 1; }
  .tb .dot { position: absolute; right: 5px; bottom: 5px; width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid var(--cap); }
  .vsep { width: 1px; height: 20px; background: var(--capline); margin: 0 3px; }
  .hsep { height: 1px; width: 22px; background: var(--capline); margin: 3px 0; }
  .title { display: flex; align-items: center; gap: 6px; padding: 0 8px 0 6px; height: 34px; font-weight: 600; font-size: 12.5px; }
  .title .saved { width: 6px; height: 6px; border-radius: 50%; background: #22A06B; }
  .title svg.i { width: 13px; height: 13px; color: var(--mu); }
  .tabs .tab { height: 30px; padding: 0 10px 0 12px; display: flex; align-items: center; gap: 8px; border-radius: 10px; font-size: 11.5px; font-weight: 500; color: var(--mu); }
  .tabs .tab svg.i { width: 13px; height: 13px; }
  .tabs .tab .x { opacity: 0; width: 11px; height: 11px; }
  .tabs .tab.on { background: var(--hov); color: var(--tx); font-weight: 600; }
  .tabs .tab.on .x { opacity: .6; }
  .sw { width: 22px; height: 22px; border-radius: 50%; margin: 3px auto; box-shadow: inset 0 0 0 1px rgba(15,23,42,.12); }
  .sw.on { box-shadow: 0 0 0 2px var(--cap), 0 0 0 3.5px var(--tx); }
  .size { width: 34px; height: 26px; display: grid; place-items: center; }
  .size i { display: block; width: 18px; height: 3px; border-radius: 3px; background: var(--tx); }
  .zoom { font-size: 11.5px; font-weight: 600; min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; }
  .pill-txt { font-size: 11.5px; font-weight: 600; padding: 0 6px; font-variant-numeric: tabular-nums; }
  .hw { font-family: 'Caveat', cursive; fill: var(--ink); font-weight: 600; }
  .ink { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

  /* Marcas numeradas de la anatomía */
  .mk { position: absolute; z-index: 9; width: 20px; height: 20px; border-radius: 50%; background: #E5484D; color: #fff; font: 700 11px/20px Inter; text-align: center; box-shadow: 0 0 0 3px rgba(229,72,77,.22); }
  .legend { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 22px; font-size: 12px; color: #3F3F46; padding: 4px; }
  .legend b { display: inline-block; width: 18px; height: 18px; border-radius: 50%; background: #E5484D; color: #fff; text-align: center; font: 700 10.5px/18px Inter; margin-right: 8px; }

  /* Popover de trazo */
  .pop { position: absolute; z-index: 8; width: 268px; border-radius: 16px; background: var(--cap); border: 1px solid var(--capline); box-shadow: 0 18px 40px -14px rgba(15,23,42,.35); backdrop-filter: blur(16px) saturate(1.4); padding: 14px; display: flex; flex-direction: column; gap: 13px; color: var(--tx); }
  .pop h4 { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--mu); margin-bottom: 7px; }
  .tips { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; }
  .tip { height: 52px; border-radius: 11px; background: var(--hov); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 10.5px; font-weight: 600; color: var(--mu); }
  .tip svg { width: 44px; height: 14px; }
  .tip.on { background: var(--on); color: var(--onfg); }
  .tip.on path { stroke: var(--onfg); }
  .tip path { stroke: var(--tx); fill: none; stroke-linecap: round; }
  .prev { height: 44px; border-radius: 11px; background: var(--hov); display: grid; place-items: center; }
  .slider { position: relative; height: 22px; display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 600; color: var(--mu); }
  .slider .tr { flex: 1; height: 4px; border-radius: 4px; background: var(--hov); position: relative; }
  .slider .tr::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 38%; border-radius: 4px; background: var(--tx); }
  .slider .th { position: absolute; left: 38%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(15,23,42,.35); }
  .cols { display: grid; grid-template-columns: repeat(8, 1fr); gap: 7px; }
  .cols .c { width: 24px; height: 24px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(15,23,42,.12); }
  .cols .c.on { box-shadow: 0 0 0 2px var(--cap), 0 0 0 3.5px var(--tx); }
  .cols .c.add { display: grid; place-items: center; background: var(--hov); box-shadow: none; color: var(--mu); }
  .cols .c.add svg { width: 13px; height: 13px; }
  .row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; }
  .row span { color: var(--mu); font-weight: 500; font-size: 11px; display: block; margin-top: 1px; }
  .tg { width: 30px; height: 18px; border-radius: 9px; background: var(--on); position: relative; }
  .tg::after { content: ''; position: absolute; right: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--onfg); }

  /* Cuaderno */
  .sheet { position: absolute; background: var(--sheet); border-radius: 4px; box-shadow: 0 1px 2px rgba(15,23,42,.08), 0 12px 30px -14px rgba(15,23,42,.28); }
  .sheet.lines { background-image: repeating-linear-gradient(transparent 0 25px, rgba(59,130,246,.16) 25px 26px); background-position: 0 64px; }
  .ed.dark .sheet.lines { background-image: repeating-linear-gradient(transparent 0 25px, rgba(255,255,255,.07) 25px 26px); }
  .thumbs { position: absolute; right: 14px; top: 64px; bottom: 64px; width: 150px; z-index: 6; border-radius: 16px; background: var(--cap); border: 1px solid var(--capline); box-shadow: var(--capshadow); backdrop-filter: blur(14px); padding: 12px 10px; display: flex; flex-direction: column; gap: 10px; }
  .thumbs .hd { display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; font-weight: 700; padding: 0 4px; }
  .thumbs .hd svg.i { width: 14px; height: 14px; color: var(--mu); }
  .th { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10.5px; color: var(--mu); font-weight: 600; }
  .th .pg { width: 76px; height: 106px; border-radius: 4px; background: var(--sheet); box-shadow: 0 0 0 1px var(--capline), 0 4px 10px -6px rgba(15,23,42,.3); background-image: repeating-linear-gradient(transparent 0 8px, rgba(59,130,246,.14) 8px 9px); }
  .th.on .pg { box-shadow: 0 0 0 2px var(--tx); }
  .th.on { color: var(--tx); }
  .th.add .pg { background: none; box-shadow: none; border: 1.5px dashed var(--capline); display: grid; place-items: center; color: var(--mu); height: 54px; }

  /* Selección */
  .selbox { position: absolute; border: 1.5px dashed #3B82F6; border-radius: 6px; background: rgba(59,130,246,.05); z-index: 4; }
  .selbox i { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: #fff; border: 1.5px solid #3B82F6; }
  .ctx { z-index: 7; }
  .ctx .lbl { font-size: 11px; font-weight: 600; color: var(--mu); padding: 0 8px 0 6px; }
  .tb.danger { color: #E5484D; }

  .ghost { opacity: .0; }
  .focus-hint { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); font-size: 11px; color: var(--mu); z-index: 5; }
</style>
</head>
<body>
<header class="doc-head" style="max-width:1180px;width:100%">
  <h1 style="font-size:20px;font-weight:800;letter-spacing:-.02em">13 · Editor — 5 propuestas de distribución</h1>
  <p style="color:#52525B;font-size:12.5px;max-width:880px;margin-top:4px">Alternativas a la propuesta 12 para comparar. Mismo contenido y mismo estilo; solo cambia dónde viven las herramientas. Se pueden mezclar ideas de varias.</p>
</header>
<div id="out" style="width:100%;max-width:1180px"></div>

<script>
const E = {
  home: '<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
  back: '<path d="M15 6l-6 6 6 6"/>',
  chev: '<path d="M6 9l6 6 6-6"/>',
  undo: '<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',
  redo: '<path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/>',
  pen: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
  hl: '<path d="M9 15 5 19h5l1.5-1.5"/><path d="m8 14 3 3 9-9-3-3z"/><path d="M14 6l4 4"/>',
  eraser: '<path d="M7 20h12"/><path d="M5.5 15.5 14 7a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L12.5 19h-4z"/><path d="m9 12 5 5"/>',
  lasso: '<path d="M7 18c-2.5-1-4-3-4-5.5C3 8 7 5 12 5s9 3 9 7-4 6.5-9 6.5c-1.2 0-2.3-.1-3.3-.4"/><path d="M8.7 18.1c.2 1.3-.4 2.4-1.7 2.9"/>',
  hand: '<path d="M7 11V6.5a1.5 1.5 0 0 1 3 0V11M10 10V4.5a1.5 1.5 0 0 1 3 0V10M13 10V5.5a1.5 1.5 0 0 1 3 0V12M16 9.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-3l-2.5-4.5a1.5 1.5 0 0 1 2.6-1.5L7 14"/>',
  shapes: '<circle cx="8.5" cy="8.5" r="4.5"/><path d="M13 13h7v7h-7z"/>',
  text: '<path d="M5 6V4h14v2M12 4v16M9 20h6"/>',
  image: '<rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-9 9"/>',
  magic: '<path d="m4 20 11-11"/><path d="m13 7 2-2 4 4-2 2z"/><path d="M19 3v2M18 4h2M7 3v2M6 4h2M20 13v2M19 14h2"/>',
  pages: '<rect x="4" y="3" width="12" height="15" rx="2"/><path d="M8 21h10a2 2 0 0 0 2-2V7"/>',
  paper: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  export: '<path d="M12 15V3M7.5 7.5 12 3l4.5 4.5"/><path d="M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/>',
  more: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', minus: '<path d="M5 12h14"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  board: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M8 12c1.5-2 3-2 4 0s2.5 2 4 0"/>',
  book: '<path d="M6 3h12a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M8 3v18"/>',
  fit: '<path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>',
  straight: '<path d="M4 8h16M4 16h16"/><path d="m9 12 3-3 3 3"/>',
  formula: '<path d="M8 4h9M8 4l5 8-5 8h9"/>',
  focus: '<path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/><circle cx="12" cy="12" r="2.5"/>',
};
const ic = (k, extra = '') => `<svg class="i" viewBox="0 0 24 24" ${extra}>${E[k]}</svg>`;
const tb = (k, cls = '', dot = '') => `<div class="tb ${cls}">${ic(k)}${dot ? `<span class="dot" style="background:${dot}"></span>` : ''}</div>`;
const mk = (n, x, y) => `<span class="mk" style="left:${x}px;top:${y}px">${n}</span>`;

/* ---------- Piezas ---------- */
const topLeft = (title, kind) => `<div class="cap" style="left:14px;top:14px">${tb('back')}<div class="vsep"></div>
  <div class="title">${ic(kind)}${title}<span class="saved" title="Guardado"></span>${ic('chev')}</div><div class="vsep"></div>${tb('undo')}${tb('redo')}</div>`;
const tabs = (on) => `<div class="cap tabs" style="left:50%;top:14px;transform:translateX(-50%)">
  ${[['book', 'Clase Física'], ['board', 'Lluvia de ideas'], ['book', 'Química']].map((t, i) => `<div class="tab${i === on ? ' on' : ''}">${ic(t[0])}${t[1]}${ic('x', 'class="i x"')}</div>`).join('')}
  <div class="tb" style="width:30px;height:30px">${ic('plus')}</div></div>`;
const topRight = (nb, pagesOn) => `<div class="cap" style="right:14px;top:14px">${nb ? tb('pages', pagesOn ? 'on' : '') : ''}${tb('paper')}${tb('export')}${tb('more')}</div>`;
const rail = (tool = 'pen', color = '#18181B', dark = false) => {
  const cols = dark ? ['#F4F4F5', '#3B82F6', '#E5484D', '#22A06B'] : ['#18181B', '#3B82F6', '#E5484D', '#22A06B'];
  return `<div class="cap v" style="left:14px;top:50%;transform:translateY(-50%)">
  ${tb('pen', tool === 'pen' ? 'on' : '', color)}${tb('hl', tool === 'hl' ? 'on' : '', '#FACC15')}${tb('eraser', tool === 'eraser' ? 'on' : '')}
  <div class="hsep"></div>${tb('lasso', tool === 'lasso' ? 'on' : '')}${tb('hand')}
  <div class="hsep"></div>${tb('shapes')}${tb('text')}${tb('image')}
  <div class="hsep"></div>${cols.map((c, i) => `<div class="sw${i === 0 ? ' on' : ''}" style="background:${c}"></div>`).join('')}
  <div class="size"><i></i></div>
  <div class="hsep"></div>${tb('magic')}</div>`;
};
const zoom = (pct = '100 %') => `<div class="cap" style="right:14px;bottom:14px">${tb('minus')}<span class="zoom">${pct}</span>${tb('plus')}<div class="vsep"></div>${tb('fit')}</div>`;
const pagePill = (t) => `<div class="cap" style="left:50%;bottom:14px;transform:translateX(-50%)">${tb('back')}<span class="pill-txt">${t}</span><div class="tb">${ic('back', 'style="transform:scaleX(-1)"')}</div><div class="vsep"></div>${tb('plus')}</div>`;

/* Contenido dibujado (pizarra) */
const boardInk = `<svg style="position:absolute;left:0;top:0" width="1180" height="720" viewBox="0 0 1180 720">
  <text class="hw" x="210" y="150" font-size="38">Plano inclinado</text>
  <path class="ink" d="M206 162c60 4 170 3 250-2" />
  <path class="ink" d="M250 470 L640 470 L640 260 Z" />
  <path class="ink" d="M318 470 a68 68 0 0 0 -8 -34" stroke-width="2"/>
  <text class="hw" x="330" y="458" font-size="24">30°</text>
  <rect x="430" y="330" width="70" height="46" transform="rotate(-28 465 353)" fill="none" stroke="#3B82F6" stroke-width="2.4" rx="3"/>
  <path d="M470 352 L470 440" stroke="#E5484D" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M462 430 L470 442 L478 430" stroke="#E5484D" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="hw" x="480" y="436" font-size="24" style="fill:#E5484D">mg</text>
  <text class="hw" x="720" y="300" font-size="30">F = m · g · sen θ</text>
  <text class="hw" x="720" y="350" font-size="30">F = 5 · 9,8 · 0,5</text>
  <text class="hw" x="720" y="400" font-size="30">F = 24,5 N</text>
  <path d="M712 412 c40 6 120 6 160 -2" stroke="#FACC15" stroke-opacity=".55" stroke-width="16" fill="none" stroke-linecap="round"/>
  <text class="hw" x="740" y="520" font-size="22" style="fill:#71717A">dato: m = 5 kg</text>
</svg>`;

function edFrame(cls, inner) { return `<div class="frame-wrap"><div class="ed ${cls}">${inner}</div></div>`; }
function sc(id, n, title, desc, frame, notes = '') {
  return `<section class="scene" id="${id}"><div class="scene-cap"><h2><span class="n">${n}</span>${title}</h2><p>${desc}</p></div>${frame}${notes ? `<div class="notes">${notes}</div>` : ''}</section>`;
}

/* Popover de trazo */
const strokePop = `<div class="pop" style="left:66px;top:150px">
  <div><h4>Punta</h4><div class="tips">
    ${[['Fina', 'M4 7h36', 1.4], ['Pluma', 'M4 9c8-6 14 4 22-2s10-2 14-2', 3], ['Marcador', 'M4 7h36', 4.5], ['Pincel', 'M4 10c10-8 20 2 36-4', 2.4]].map((t, i) => `<div class="tip${i === 1 ? ' on' : ''}"><svg viewBox="0 0 44 14"><path d="${t[1]}" stroke-width="${t[2]}"/></svg>${t[0]}</div>`).join('')}
  </div></div>
  <div><h4>Grosor</h4><div class="prev"><svg width="200" height="26" viewBox="0 0 200 26"><path d="M8 18c30-16 50 6 80-4s50-10 104-2" fill="none" stroke="#3B82F6" stroke-width="3.4" stroke-linecap="round"/></svg></div>
    <div class="slider" style="margin-top:8px">0,5<div class="tr"><span class="th"></span></div>8</div></div>
  <div><h4>Color</h4><div class="cols">
    ${['#18181B', '#3B82F6', '#E5484D', '#22A06B', '#F59E0B', '#8B5CF6', '#EC4899', '#71717A'].map((c, i) => `<span class="c${i === 1 ? ' on' : ''}" style="background:${c}"></span>`).join('')}
    <span class="c" style="background:#0EA5E9"></span><span class="c" style="background:#A16207"></span><span class="c add">${ic('plus')}</span></div></div>
  <div class="row"><div>Sensible a la presión<span>El trazo engorda al apretar</span></div><span class="tg"></span></div>
</div>`;

/* Cuaderno */
const nbSheets = (dark) => `
  <div class="sheet lines" style="left:300px;top:-260px;width:480px;height:340px"></div>
  <div class="sheet lines" style="left:300px;top:100px;width:480px;height:679px">
    <svg width="480" height="679" viewBox="0 0 480 679" style="position:absolute;inset:0">
      <text class="hw" x="44" y="58" font-size="30">Tema 3 · Dinámica</text>
      <text class="hw" x="44" y="112" font-size="24">Segunda ley de Newton:</text>
      <text class="hw" x="80" y="164" font-size="28">ΣF = m · a</text>
      <rect x="72" y="138" width="130" height="36" rx="6" fill="none" stroke="#3B82F6" stroke-width="2"/>
      <text class="hw" x="44" y="242" font-size="24">Ejemplo: bloque de 5 kg, F = 20 N</text>
      <text class="hw" x="80" y="294" font-size="24">a = 20 / 5 = 4 m/s²</text>
      <path d="M76 300 c40 6 100 6 130 -2" stroke="#FACC15" stroke-opacity=".55" stroke-width="14" fill="none" stroke-linecap="round"/>
    </svg></div>`;
const thumbs = `<div class="thumbs"><div class="hd">Páginas<span style="display:flex;gap:4px">${ic('more')}</span></div>
  <div class="th">${'<div class="pg"></div>'}1</div><div class="th on"><div class="pg"></div>2</div><div class="th"><div class="pg"></div>3</div>
  <div class="th add"><div class="pg">${ic('plus')}</div></div></div>`;

/* Escenas: propuestas alternativas */
const COLS = ['#18181B', '#3B82F6', '#E5484D', '#22A06B'];
const sws = (n = 4, sz = 20) => COLS.slice(0, n).map((c, i) => `<span class="sw${i === 0 ? ' on' : ''}" style="background:${c};width:${sz}px;height:${sz}px;margin:0 4px"></span>`).join('');
const docMini = (t, k) => `<div class="cap" style="left:14px;top:14px">${tb('back')}<div class="title">${ic(k)}${t}<span class="saved"></span>${ic('chev')}</div></div>`;
const actMini = `<div class="cap" style="right:14px;top:14px">${tb('undo')}${tb('redo')}<div class="vsep"></div>${tb('paper')}${tb('export')}${tb('more')}</div>`;
let h = '';

/* A: dock inferior */
const dock = (extra = '') => `<div class="cap" style="left:50%;bottom:16px;transform:translateX(-50%);padding:6px;border-radius:18px;gap:4px">
  ${tb('pen', 'on', '#18181B')}${tb('hl', '', '#FACC15')}${tb('eraser')}${tb('lasso')}<div class="vsep"></div>${tb('shapes')}${tb('text')}${tb('image')}${tb('magic')}<div class="vsep"></div>${sws()}<div class="size"><i></i></div>${extra}</div>`;
h += sc('a', 'A', 'Dock inferior', 'Todas las herramientas en una sola cápsula abajo al centro, como un dock. La mano descansa abajo al escribir con tableta, y arriba queda el lienzo totalmente libre.',
  edFrame('grid', boardInk + docMini('Lluvia de ideas', 'board') + actMini + dock() + `<div class="cap" style="right:14px;bottom:16px">${tb('minus')}<span class="zoom">100 %</span>${tb('plus')}</div>`),
  '<b>A favor:</b> lienzo despejado arriba y a los lados; alcance cómodo. <b>En contra:</b> la mano puede taparla al escribir abajo; en cuaderno compite con el contador de páginas (este se mueve arriba al centro).');

/* B: barra superior única */
h += sc('b', 'B', 'Una sola barra arriba', 'Estilo cuaderno digital clásico: una única franja de vidrio arriba con documento, herramientas y acciones. Lo más fácil de aprender; todo está en un lugar.',
  edFrame('grid', boardInk + `<div class="cap" style="left:14px;right:14px;top:14px;justify-content:space-between;padding:5px 6px">
     <div style="display:flex;align-items:center;gap:2px">${tb('back')}<div class="title">${ic('board')}Lluvia de ideas<span class="saved"></span>${ic('chev')}</div>${tb('undo')}${tb('redo')}</div>
     <div style="display:flex;align-items:center;gap:2px">${tb('pen', 'on', '#18181B')}${tb('hl', '', '#FACC15')}${tb('eraser')}${tb('lasso')}${tb('hand')}<div class="vsep"></div>${tb('shapes')}${tb('text')}${tb('image')}${tb('magic')}<div class="vsep"></div>${sws()}</div>
     <div style="display:flex;align-items:center;gap:2px">${tb('paper')}${tb('export')}${tb('more')}</div></div>` +
    `<div class="cap tabs" style="left:50%;top:66px;transform:translateX(-50%);padding:3px">${[['book','Clase Física'],['board','Lluvia de ideas'],['book','Química']].map((t,i)=>`<div class="tab${i===1?' on':''}" style="height:24px">${ic(t[0])}${t[1]}</div>`).join('')}</div>` +
    `<div class="cap" style="right:14px;bottom:14px">${tb('minus')}<span class="zoom">100 %</span>${tb('plus')}</div>`),
  '<b>A favor:</b> familiar, ordenado, ideal para pantallas anchas. <b>En contra:</b> es la más “programa”; ocupa todo el ancho.');

/* C: mínima + menú radial */
const radial = `<svg style="position:absolute;left:0;top:0;z-index:7" width="1180" height="720" viewBox="0 0 1180 720">
  <circle cx="600" cy="560" r="96" fill="var(--cap)" stroke="var(--capline)"/>
  <circle cx="600" cy="560" r="36" fill="var(--on)"/></svg>
  ${[['pen',0],['hl',45],['eraser',90],['lasso',135],['shapes',180],['text',225],['image',270],['magic',315]].map(([k,a])=>{const r=66,x=600+r*Math.sin(a*Math.PI/180),y=560-r*Math.cos(a*Math.PI/180);return `<div class="tb${k==='pen'?' on':''}" style="position:absolute;z-index:8;left:${x-17}px;top:${y-17}px">${ic(k)}</div>`}).join('')}
  <div style="position:absolute;z-index:8;left:584px;top:544px;width:32px;height:32px;display:grid;place-items:center;color:var(--onfg)">${ic('x')}</div>`;
h += sc('c', 'C', 'Mínima + rueda', 'Solo un botón flotante con la herramienta y el color actual. Al tocarlo (o mantener presionado el lápiz, o el botón del Pad Wacom) se abre una rueda alrededor del cursor.',
  edFrame('grid', boardInk + docMini('Lluvia de ideas', 'board') + `<div class="cap" style="right:14px;top:14px">${tb('undo')}${tb('redo')}${tb('more')}</div>` +
    `<div class="cap" style="left:14px;bottom:14px;border-radius:999px;padding:6px">${tb('pen','on','#18181B')}${sws(4,18)}</div>` + radial),
  '<b>A favor:</b> casi nada en pantalla, máxima sensación de papel; rápida con tableta. <b>En contra:</b> menos descubrible para usuarios nuevos; conviene como modo opcional.');

/* D: paleta flotante movible */
const palette = `<div class="cap v" style="left:1040px;top:130px;width:96px;padding:8px;border-radius:18px;gap:6px">
  <div style="width:30px;height:4px;border-radius:4px;background:var(--capline);margin:0 auto 2px"></div>
  <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:4px">${tb('pen','on','#18181B')}${tb('hl','','#FACC15')}${tb('eraser')}${tb('lasso')}${tb('shapes')}${tb('text')}${tb('image')}${tb('magic')}</div>
  <div class="hsep" style="width:70px"></div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;justify-items:center">${['#18181B','#3B82F6','#E5484D','#22A06B','#F59E0B','#8B5CF6'].map((c,i)=>`<span class="sw${i===0?' on':''}" style="background:${c};width:20px;height:20px;margin:0"></span>`).join('')}</div>
  <div class="slider" style="width:76px;height:16px"><div class="tr"><span class="th" style="width:12px;height:12px;margin:-6px 0 0 -6px"></span></div></div></div>`;
h += sc('d', 'D', 'Paleta flotante movible', 'Una paleta compacta tipo estudio de arte que puedes arrastrar a cualquier lugar (o anclar a un borde). Colores y grosor siempre visibles sin abrir nada.',
  edFrame('grid', boardInk.replace('x="720"','x="690"') + docMini('Lluvia de ideas', 'board') + actMini + palette + `<div class="cap" style="right:14px;bottom:14px">${tb('minus')}<span class="zoom">100 %</span>${tb('plus')}</div>`),
  '<b>A favor:</b> se adapta a zurdos/diestros y a cada pantalla; colores a un toque. <b>En contra:</b> puede tapar contenido si se deja en medio.');

/* E: riel derecho + barra contextual abajo */
h += sc('e', 'E', 'Herramientas a la derecha + barra de la herramienta', 'Riel a la derecha (cómodo para diestros con tableta: el brazo no tapa la pantalla). Abajo aparece una barra que cambia según la herramienta: con el lápiz muestra punta, colores y grosor.',
  edFrame('grid', boardInk + docMini('Lluvia de ideas', 'board') + `<div class="cap" style="left:50%;top:14px;transform:translateX(-50%)">${tb('undo')}${tb('redo')}</div>` +
    `<div class="cap v" style="right:14px;top:50%;transform:translateY(-50%)">${tb('pen','on')}${tb('hl')}${tb('eraser')}<div class="hsep"></div>${tb('lasso')}${tb('hand')}<div class="hsep"></div>${tb('shapes')}${tb('text')}${tb('image')}${tb('magic')}<div class="hsep"></div>${tb('paper')}${tb('export')}${tb('more')}</div>` +
    `<div class="cap" style="left:50%;bottom:16px;transform:translateX(-50%);gap:6px;padding:6px 10px"><span class="lbl" style="font-size:11px;font-weight:700;color:var(--mu)">Lápiz</span><div class="vsep"></div>
      ${['M4 7h36','M4 9c8-6 14 4 22-2s10-2 14-2','M4 10c10-8 20 2 36-4'].map((d,i)=>`<div class="tb${i===1?' on':''}" style="width:46px"><svg width="36" height="14" viewBox="0 0 44 14"><path d="${d}" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></div>`).join('')}
      <div class="vsep"></div>${['#18181B','#3B82F6','#E5484D','#22A06B','#F59E0B','#8B5CF6'].map((c,i)=>`<span class="sw${i===0?' on':''}" style="background:${c};width:20px;height:20px;margin:0 3px"></span>`).join('')}<span class="sw" style="width:20px;height:20px;margin:0 3px;background:var(--hov);box-shadow:none;display:grid;place-items:center;color:var(--mu)">${ic('plus','style="width:12px;height:12px"')}</span>
      <div class="vsep"></div><div class="slider" style="width:110px">${''}<div class="tr"><span class="th"></span></div></div></div>` +
    `<div class="cap" style="left:14px;bottom:14px">${tb('minus')}<span class="zoom">100 %</span>${tb('plus')}</div>`),
  '<b>A favor:</b> los ajustes de la herramienta siempre visibles, sin popovers; el brazo no tapa el riel. <b>En contra:</b> dos zonas a mirar; para zurdos se invierte (opción en Ajustes).');

document.getElementById('out').innerHTML = h;
</script>
<script src="_shell.js"></script>
<script>fitFrames();</script>
</body>
</html>
