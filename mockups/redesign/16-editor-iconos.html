<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>Finily — Editor: iconos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:28px;background:#EDEDEA;font-family:Inter,sans-serif;color:#18181B}
h1{font-size:20px;margin:0 0 4px}p.lead{color:#52525B;font-size:13px;margin:0 0 22px;max-width:900px}
.set{background:#fff;border-radius:16px;padding:18px 22px;margin-bottom:18px;box-shadow:0 10px 30px -18px rgba(15,23,42,.3)}
.set h2{font-size:14px;margin:0 0 2px}.set .d{font-size:12px;color:#71717A;margin-bottom:14px}
.bar{display:flex;align-items:center;gap:4px;padding:8px 10px;border-radius:12px;background:#FAFAF9;border:1px solid rgba(15,23,42,.07);width:max-content}
.t{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;color:#27272A;position:relative}
.t.on{background:#18181B;color:#fff}
.t svg{width:22px;height:22px}
.lbl{display:flex;gap:4px;margin-top:6px;padding-left:10px}.lbl span{width:44px;text-align:center;font-size:9.5px;color:#A1A1AA}
.sep{width:1px;height:24px;background:rgba(15,23,42,.1);margin:0 6px}
.big{display:flex;gap:18px;margin-top:14px}.big .t{width:88px;height:88px;border-radius:20px;background:#FAFAF9;border:1px solid rgba(15,23,42,.06)}.big .t svg{width:44px;height:44px}
.rec{display:inline-block;font-size:10.5px;font-weight:700;background:#18181B;color:#fff;border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:2px}
.dark{background:#1A1B22}.dark .bar{background:#23242D;border-color:rgba(255,255,255,.07)}.dark .t{color:#E4E4E7}.dark .t.on{background:#F4F4F5;color:#18181B}.dark h2{color:#F4F4F5}.dark .sep{background:rgba(255,255,255,.1)}
</style></head><body>
<h1>16 · Editor — iconos de herramientas</h1>
<p class="lead">Mismo diseño de la propuesta F1 (tu captura). Solo se pulen los iconos de la barra. Orden: lápiz · resaltador · borrador | lazo · mano | figuras · texto · imagen · magia. La punta del lápiz/resaltador toma el color de tinta actual (sustituye el puntito suelto).</p>
<div id="out"></div>
<script>
const ORDER=['pen','hl','er','|','lasso','hand','|','shapes','text','image','magic'];
const NAMES={pen:'Lápiz',hl:'Resaltador',er:'Borrador',lasso:'Lazo',hand:'Mano',shapes:'Figuras',text:'Texto',image:'Imagen',magic:'Magia'};
const INK='#2563EB', HL='#FACC15';
/* Juego actual (aprox.) */
const CUR={pen:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',hl:'<path d="M9 15 5 19h5l1.5-1.5"/><path d="m8 14 3 3 9-9-3-3z"/>',er:'<path d="M7 20h12"/><path d="M5.5 15.5 14 7a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L12.5 19h-4z"/>',lasso:'<path d="M7 18c-2.5-1-4-3-4-5.5C3 8 7 5 12 5s9 3 9 7-4 6.5-9 6.5"/>',hand:'<path d="M7 11V6.5a1.5 1.5 0 0 1 3 0V11M10 10V4.5a1.5 1.5 0 0 1 3 0V10M13 10V5.5a1.5 1.5 0 0 1 3 0V12M16 9.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-3l-2.5-4.5"/>',shapes:'<circle cx="8.5" cy="8.5" r="4.5"/><path d="M13 13h7v7h-7z"/>',text:'<path d="M5 6V4h14v2M12 4v16M9 20h6"/>',image:'<rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-9 9"/>',magic:'<path d="m4 20 11-11"/><path d="m13 7 2-2 4 4-2 2z"/><path d="M19 3v2M18 4h2"/>'};
/* A: línea refinada, misma rejilla, puntas con tinta */
const A={
 pen:`<path d="M15.5 3.5l5 5L9 20H4v-5z"/><path d="M13 6l5 5"/><path d="M4 20l3.2-.6L4.6 16.8z" fill="${INK}" stroke="${INK}"/>`,
 hl:`<path d="M14 3.5l6.5 6.5-7 7-6.5-6.5z"/><path d="M7 10.5l6.5 6.5-2 2H8l-2.5-2.5v-3.5z"/><path d="M4 21h7" stroke="${HL}" stroke-width="3"/>`,
 er:`<path d="M8.5 19.5 3.8 14.8a1.6 1.6 0 0 1 0-2.3l8.7-8.7a1.6 1.6 0 0 1 2.3 0l5.4 5.4a1.6 1.6 0 0 1 0 2.3L12 19.5z"/><path d="M8 10l6.5 6.5"/><path d="M12 19.5h8"/>`,
 lasso:`<ellipse cx="12" cy="10" rx="8.5" ry="5.5" stroke-dasharray="3 2.6"/><path d="M8 15c-1 1.6-.6 3.6 1.4 4.5"/><circle cx="9.6" cy="20" r="1.2" fill="currentColor"/>`,
 hand:`<path d="M8 12.5V6a1.6 1.6 0 0 1 3.2 0v5"/><path d="M11.2 10.5V4.6a1.6 1.6 0 0 1 3.2 0v6"/><path d="M14.4 10.5V6.2a1.6 1.6 0 0 1 3.2 0v7.3a7 7 0 0 1-7 7h-.6a6 6 0 0 1-5-2.7l-2.4-3.8a1.6 1.6 0 0 1 2.6-1.8L8 15"/>`,
 shapes:`<path d="M7 3.5l4.2 7.3H2.8z"/><circle cx="17" cy="7.2" r="3.7"/><rect x="5" y="13.5" width="14" height="7" rx="1.6"/>`,
 text:`<path d="M4.5 7V4.5h15V7"/><path d="M12 4.5v15"/><path d="M9 19.5h6"/>`,
 image:`<rect x="3" y="4.5" width="18" height="15" rx="3"/><circle cx="8.5" cy="9.5" r="1.7"/><path d="M3.5 17l5-4.5 3.5 3 3-2.5 5.5 4.5"/>`,
 magic:`<path d="M4 20 14.5 9.5"/><path d="M13 8l2.5-2.5 3 3L16 11z"/><path d="M8 3.5v3M6.5 5h3M19 13v3M17.5 14.5h3M18 2.8l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6z"/>`};
/* B: duotono (relleno suave + línea) */
const B={
 pen:`<path d="M15.5 3.5l5 5L9 20H4v-5z" fill="currentColor" fill-opacity=".14"/><path d="M15.5 3.5l5 5L9 20H4v-5z"/><path d="M13 6l5 5"/><path d="M4 20l3.2-.6L4.6 16.8z" fill="${INK}" stroke="${INK}"/>`,
 hl:`<path d="M14 3.5l6.5 6.5-7 7-6.5-6.5z" fill="currentColor" fill-opacity=".14"/><path d="M14 3.5l6.5 6.5-7 7-6.5-6.5z"/><path d="M7 10.5l6.5 6.5-2 2H8l-2.5-2.5v-3.5z" fill="${HL}" stroke="currentColor"/>`,
 er:`<path d="M8.5 19.5 3.8 14.8a1.6 1.6 0 0 1 0-2.3l4.2-4.2 6.5 6.5-5 5z" fill="#F9A8D4" fill-opacity=".8"/><path d="M8.5 19.5 3.8 14.8a1.6 1.6 0 0 1 0-2.3l8.7-8.7a1.6 1.6 0 0 1 2.3 0l5.4 5.4a1.6 1.6 0 0 1 0 2.3L12 19.5z"/><path d="M8 10l6.5 6.5"/><path d="M12 19.5h8"/>`,
 lasso:A.lasso.replace('<ellipse','<ellipse fill="currentColor" fill-opacity=".1"'),
 hand:`<path d="M8 12.5V6a1.6 1.6 0 0 1 3.2 0v5M11.2 10.5V4.6a1.6 1.6 0 0 1 3.2 0v6M14.4 10.5V6.2a1.6 1.6 0 0 1 3.2 0v7.3a7 7 0 0 1-7 7h-.6a6 6 0 0 1-5-2.7l-2.4-3.8a1.6 1.6 0 0 1 2.6-1.8L8 15z" fill="currentColor" fill-opacity=".12"/>`+A.hand,
 shapes:`<path d="M7 3.5l4.2 7.3H2.8z" fill="currentColor" fill-opacity=".14"/><circle cx="17" cy="7.2" r="3.7" fill="currentColor" fill-opacity=".14"/><rect x="5" y="13.5" width="14" height="7" rx="1.6" fill="currentColor" fill-opacity=".14"/>`+A.shapes,
 text:`<rect x="3" y="3" width="18" height="18" rx="4" fill="currentColor" fill-opacity=".1" stroke="none"/><path d="M7.5 8V6.5h9V8M12 6.5v11M10 17.5h4"/>`,
 image:`<rect x="3" y="4.5" width="18" height="15" rx="3" fill="currentColor" fill-opacity=".1"/>`+A.image,
 magic:A.magic+`<path d="M18 2.8l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6z" fill="#F59E0B" stroke="#F59E0B"/>`};
/* C: lápices dibujados (instrumentos) para el grupo de escritura; resto = A */
const C=Object.assign({},A,{
 pen:`<g transform="rotate(45 12 12)"><rect x="9.5" y="5" width="5" height="14" rx="1" fill="#F4F4F5" stroke="currentColor" stroke-width="1.2"/><path d="M9.5 19l2.5 4 2.5-4z" fill="#E4D5B7" stroke="currentColor" stroke-width="1.2"/><path d="M11.3 21.9 12 23l.7-1.1z" fill="${INK}" stroke="${INK}"/><rect x="9.5" y="5" width="5" height="3" fill="${INK}" stroke="none"/></g>`,
 hl:`<g transform="rotate(45 12 12)"><rect x="8.5" y="4" width="7" height="13" rx="1.6" fill="#FAFAFA" stroke="currentColor" stroke-width="1.2"/><path d="M9.5 17h5l-.8 4h-3.4z" fill="${HL}" stroke="currentColor" stroke-width="1.2"/></g>`,
 er:`<g transform="rotate(45 12 12)"><rect x="8.5" y="4" width="7" height="12" rx="1.6" fill="#F4F4F5" stroke="currentColor" stroke-width="1.2"/><rect x="8.5" y="15" width="7" height="6" rx="1.6" fill="#F9A8D4" stroke="currentColor" stroke-width="1.2"/></g>`});
const sets=[
 ['Actual','Lo que hay hoy: grosores y tamaños distintos entre iconos, el lazo y la magia se leen poco, el puntito de color flota fuera del icono.',CUR,false],
 ['A · Línea refinada','Mismo estilo de trazo fino de Inicio (1,6 px, esquinas redondas, rejilla 24). Todos con el mismo peso óptico. La punta del lápiz y la raya del resaltador muestran la tinta actual.',A,true],
 ['B · Duotono','Línea + relleno suave del 12 %: se ven más “sólidos” y se distinguen mejor de lejos; el borrador lleva su goma rosa y la magia una chispa ámbar.',B,false],
 ['C · Instrumentos','Lápiz, resaltador y borrador dibujados como objetos (más personalidad); el resto en línea refinada.',C,false]];
const svg=(d,sw=1.6)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const bar=(set,on='pen')=>`<div class="bar">${ORDER.map(k=>k==='|'?'<div class="sep"></div>':`<div class="t${k===on?' on':''}">${svg(set[k])}</div>`).join('')}</div>`;
const lbl=`<div class="lbl">${ORDER.map(k=>k==='|'?'<span style="width:13px"></span>':`<span>${NAMES[k]}</span>`).join('')}</div>`;
let h='';
for(const [t,d,s,rec] of sets){h+=`<div class="set"><h2>${t}${rec?'<span class="rec">Recomendado</span>':''}</h2><div class="d">${d}</div>${bar(s)}${lbl}<div class="big">${['pen','hl','er','lasso','magic'].map(k=>`<div class="t">${svg(s[k],1.4)}</div>`).join('')}</div></div>`;}
h+=`<div class="set dark"><h2>A, B y C en modo oscuro</h2><div class="d" style="color:#A1A1AA">Comprobación de contraste sobre grafito.</div>${bar(A)}<div style="height:8px"></div>${bar(B)}<div style="height:8px"></div>${bar(C)}</div>`;
document.getElementById('out').innerHTML=h;
</script></body></html>
